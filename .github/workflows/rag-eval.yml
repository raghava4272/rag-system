name: Phase 3 RAG quality gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rag-evaluation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Test and evaluate RAG quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Build the document index
        run: python scripts/build_index.py data/raw

      - name: Run the golden RAG evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKENIZERS_PARALLELISM: "false"
        run: >-
          python eval/run_eval.py
          --dataset eval/golden_dataset.jsonl
          --threshold 0.8
          --report artifacts/rag-evaluation.md

      - name: Upload the evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rag-evaluation-report
          path: artifacts/rag-evaluation.md
          if-no-files-found: warn
          retention-days: 14
