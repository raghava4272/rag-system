name: rag-system

x-rag-job: &rag-job
  image: rag-system:local
  working_dir: /app
  init: true
  read_only: true
  restart: "no"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g,uid=10001,gid=10001
  volumes:
    - ./data/raw:/app/data/raw:ro
    - rag-chroma:/app/data/chroma
    - rag-cache:/home/rag/.cache
    - rag-artifacts:/app/artifacts

services:
  index:
    <<: *rag-job
    build:
      context: .
      target: runtime
    entrypoint: ["python", "scripts/container.py", "index"]
    command: []

  ask:
    <<: *rag-job
    entrypoint: ["python", "scripts/container.py", "ask"]
    command: ["--help"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}

  api:
    <<: *rag-job
    entrypoint: ["python", "-m", "uvicorn", "src.api:app"]
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      RAG_API_KEY_HASHES: ${RAG_API_KEY_HASHES:-}
      RAG_DOCUMENT_PERMISSIONS: ${RAG_DOCUMENT_PERMISSIONS:-}
      RAG_RATE_LIMIT_REQUESTS: ${RAG_RATE_LIMIT_REQUESTS:-30}
      RAG_RATE_LIMIT_WINDOW_SECONDS: ${RAG_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  evaluate:
    <<: *rag-job
    entrypoint: ["python", "scripts/container.py", "evaluate", "--report", "/app/artifacts/eval-report.md"]
    command: []
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}

  report:
    <<: *rag-job
    entrypoint: ["cat", "/app/artifacts/eval-report.md"]
    command: []

volumes:
  rag-chroma:
  rag-cache:
  rag-artifacts:
